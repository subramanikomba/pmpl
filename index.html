<style>
:root{--panel:#10141d;--panel2:#171d29;--panel3:#1e2735;--ink:#e9eef6;--ink-dim:#8f9db1;--ink-faint:#5f6c81;
--work:#eef1f5;--card:#fff;--wink:#1a2230;--wink-dim:#5a6678;--acid:#f2820c;--acid-deep:#c9640a;--chrome:#ffb84d;
--ok:#22ab57;--warn:#f0a41c;--alarm:#e53a3a;--idle:#55617a;--teal:#2ba6a4;--violet:#8b7bd8;--line-l:#dde3ea;--line-d:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--work);color:var(--wink);font-size:14px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--panel);padding:20px}
.lcard{background:var(--card);border-radius:16px;padding:28px 26px;width:min(400px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.lcard img{width:64px;height:64px;margin-bottom:10px}
.lcard h1{margin:0 0 3px;font-size:19px}.lcard .sub{color:var(--wink-dim);font-size:12.5px;margin-bottom:16px}
.lcard label{display:block;text-align:left;font-size:12px;color:var(--wink-dim);margin:12px 0 5px}
.lcard input{width:100%;padding:11px;border:1px solid var(--line-l);border-radius:9px;background:#fafbfc}
.lcard input:focus{outline:none;border-color:var(--acid)}
.lbtn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--acid);color:#fff;font-weight:600;font-size:15px}
.lbtn:disabled{opacity:.6}.lerr{color:var(--alarm);font-size:12.5px;margin-top:12px;min-height:16px}
.lbrand{font-weight:700;color:var(--acid-deep);font-size:12px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px}
/* shell */
header{background:var(--panel);color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--acid);padding-top:max(10px,env(safe-area-inset-top))}
.ctx{line-height:1.25}.ctx .c1{font-weight:700;font-size:14px}.ctx .c2{font-size:11px;color:var(--ink-dim)}
.sp{flex:1}
.brandR{display:flex;align-items:center;gap:9px}
.brandR img{width:34px;height:34px}
.brandR .bt{line-height:1.15;text-align:right}.brandR .bt b{font-size:13px}.brandR .bt span{display:block;font-size:9.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px}
.who{text-align:right;font-size:11.5px;color:var(--ink-dim);line-height:1.25}.who b{color:var(--ink);display:block}
.ghost{background:var(--panel2);color:var(--ink-dim);border:1px solid var(--line-d);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;transition:background .15s,color .15s,border-color .15s}
.ghost:hover{background:var(--panel3);color:var(--ink);border-color:var(--acid)}
.modal input,.modal select,.modal textarea{width:100%;padding:9px;border:1px solid var(--line-l);border-radius:7px;background:#fafbfc;font-family:'IBM Plex Mono',monospace}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--acid)}
.modal .err{color:var(--alarm);font-size:12px;min-height:15px;margin-top:6px}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--acid-deep)}th .ar{font-size:9px;opacity:.7;margin-left:2px}
.locrow{display:flex;gap:7px;align-items:center;margin-bottom:6px}.locrow input{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef1f4;border-radius:15px;padding:4px 7px 4px 11px;font-size:12px;margin:4px 5px 0 0}
.chip button{border:0;background:#d9dee5;color:#556;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
.filters .f{min-width:150px}
nav.tabs{background:var(--panel2);display:flex;gap:4px;padding:6px 12px;overflow-x:auto}
nav.tabs button{background:transparent;border:0;color:var(--ink-dim);padding:8px 14px;border-radius:7px;font-weight:600;font-size:13px;white-space:nowrap}
nav.tabs button.on{background:var(--acid);color:#1a1206}
main{max-width:1200px;margin:0 auto;padding:16px}
/* dark board */
.board{background:var(--panel);color:var(--ink);border-radius:14px;padding:16px 16px 18px;margin-bottom:16px}
.board h3{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-dim);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.board h3::before{content:"";width:18px;height:2px;background:var(--acid)}
.trainsel{display:inline-flex;gap:5px;background:var(--panel2);padding:5px;border-radius:9px;margin-bottom:10px}
.trainsel button{background:transparent;border:0;color:var(--ink-dim);padding:6px 14px;border-radius:6px;font-weight:600;font-size:13px}
.trainsel button.on{background:var(--acid);color:#1a1206}
.rail{display:flex;background:var(--panel2);border-radius:11px;padding:6px;overflow-x:auto}
.step{flex:1 0 auto;min-width:96px;cursor:pointer;padding:10px 11px 12px;border-radius:8px;border:1px solid transparent}
.step:hover{background:var(--panel3)}.step .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint)}
.step .m{font-weight:600;font-size:12px;color:var(--ink-dim);margin-top:2px}.step .d{font-size:9.5px;color:var(--ink-faint);margin-top:2px}
.step.done .n{color:var(--ok)}.step.active{background:linear-gradient(180deg,#3a2a0e,#241a09);border-color:var(--acid)}
.step.active .m{color:var(--chrome)}.step.active .n{color:var(--acid)}
.railnav{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.railnav button{border:0;border-radius:7px;padding:8px 15px;font-weight:600;font-size:13px}
.np{background:var(--panel3);color:var(--ink-dim)}.nn{background:var(--acid);color:#1a1206}.rl{color:var(--ink-dim);font-size:12px}
.rgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}@media(max-width:820px){.rgrid{grid-template-columns:1fr}}
.rc{background:var(--panel2);border-radius:11px;padding:14px}
.rc .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);margin-bottom:9px}
.inrow{display:flex;gap:9px;flex-wrap:wrap}.fieldd{flex:1;min-width:104px}
.fieldd label{display:block;font-size:10.5px;color:var(--ink-dim);margin-bottom:4px}
.fieldd input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:15px;background:var(--panel);border:1px solid var(--line-d);color:var(--ink);padding:9px;border-radius:7px}
.fieldd input:focus{outline:none;border-color:var(--acid)}.fieldd .u{font-size:10px;color:var(--ink-faint)}
.impb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:520px){.impb{grid-template-columns:1fr}}
.impc{background:var(--panel);border:1px solid var(--line-d);border-radius:9px;padding:10px}
.impc .it{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);display:block;margin-bottom:8px}
.improw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-dim)}
.simp{width:58px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--panel2);border:1px solid var(--line-d);color:var(--ink);padding:6px;border-radius:6px}
.imptot{font-family:'IBM Plex Mono',monospace;color:var(--chrome);font-weight:600}
.prog{margin-top:12px}.prog .pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-dim);margin-bottom:5px}
.pbar{height:9px;background:var(--panel);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acid),var(--chrome))}
.cue{border-radius:9px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line-d)}
.cue .dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:none;background:var(--idle)}
.cue.go .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(34,171,87,.18)}
.cue.stop .dot{background:var(--alarm);box-shadow:0 0 0 4px rgba(229,58,58,.18)}
.cue.hold .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(240,164,28,.18)}
.cue b{display:block;font-size:13.5px;margin-bottom:2px;color:var(--ink)}.cue span{font-size:12px;color:var(--ink-dim);line-height:1.45}
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;margin-top:6px}
.tank{background:var(--panel2);border-radius:10px;padding:10px;position:relative;cursor:pointer}.tank:hover{background:var(--panel3)}
.tank .tk{font-weight:600;font-size:12px;color:var(--ink)}.tank .td{font-size:9.5px;color:var(--ink-faint);height:22px;line-height:1.1}
.tvis{height:38px;border-radius:6px;background:var(--panel);margin:7px 0 5px;position:relative;overflow:hidden;border:1px solid var(--line-d)}
.tvis i{position:absolute;left:0;right:0;bottom:0}.tank .tval{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim)}.tank .tval b{color:var(--ink)}
.tflag{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:5px}
.tflag.hi{background:rgba(229,58,58,.16);color:#ff8f8f}.tflag.lo{background:rgba(240,164,28,.16);color:#f8c15f}
/* light cards */
.card{background:var(--card);border:1px solid var(--line-l);border-radius:13px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#7a8699;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:20px;height:2px;background:var(--acid-deep)}
.grid{display:grid;gap:11px 12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.g3,.g4{grid-template-columns:1fr 1fr}}
.f label{display:block;font-size:11px;color:var(--wink-dim);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px;border:1px solid var(--line-l);border-radius:7px;background:#fafbfc;font-family:'IBM Plex Mono',monospace}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--acid)}
.f input[readonly]{background:#eef1f4;color:var(--acid-deep);font-weight:600}
.sec{grid-column:1/-1;margin-top:8px;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--acid-deep);border-bottom:1px solid var(--line-l);padding-bottom:5px}
.sec em{font-weight:400;text-transform:none;letter-spacing:0;color:var(--wink-dim)}
.btn{padding:11px 18px;border:0;border-radius:9px;font-weight:600;font-size:14px}
.btn.primary{background:var(--acid);color:#fff}.btn.primary:hover{background:var(--acid-deep)}
.btn.done{background:var(--ok);color:#fff}.btn.g{background:#eef0f3;color:var(--wink-dim)}.btn.danger{background:#fdecec;color:#c62828}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.pill.draft{background:rgba(240,164,28,.16);color:#a9700a}.pill.done{background:rgba(34,171,87,.14);color:#1a8f47}
.pill.off{background:#eceef1;color:#77808d}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--wink-dim);padding:7px 8px;border-bottom:1.5px solid var(--line-l)}
td{padding:8px;border-bottom:1px solid #eef1f4}td.m,th.m{font-family:'IBM Plex Mono',monospace;text-align:right}
tr.clk{cursor:pointer}tr.clk:hover td{background:#fafbfc}.hwrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kpi{border-left:3px solid var(--acid);padding-left:11px}.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
.kpi .l{font-size:10px;color:var(--wink-dim);text-transform:uppercase;letter-spacing:.4px}
.kpi.a2{border-color:var(--teal)}.kpi.a3{border-color:var(--violet)}.kpi.a4{border-color:var(--ok)}
.rem{display:flex;flex-direction:column;gap:10px}
.rmi{border-radius:11px;padding:12px 14px;border:1px solid var(--line-l);background:#fafbfc;position:relative;overflow:hidden}
.rmi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.rmi.ok::before{background:var(--ok)}.rmi.warn::before{background:var(--warn)}.rmi.alarm::before{background:var(--alarm)}
.rmi .rh{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}.rmi .rt{font-weight:600;font-size:13px}
.rmi .rg{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.rg.ok{background:rgba(34,171,87,.12);color:#1a8f47}.rg.warn{background:rgba(240,164,28,.14);color:#a9700a}.rg.alarm{background:rgba(229,58,58,.12);color:#c62828}
.rmi .rb{font-size:12px;color:var(--wink-dim);line-height:1.45}.rmi .rb b{color:var(--wink);font-family:'IBM Plex Mono',monospace}
.note{font-size:12px;color:var(--wink-dim);background:#fafbfc;border:1px solid var(--line-l);border-radius:9px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .mc{background:#fff;border-radius:14px;padding:22px;width:min(460px,94vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px}.modal p{color:var(--wink-dim);font-size:13.5px;margin:0 0 16px}
footer{text-align:center;color:var(--wink-dim);font-size:11px;padding:18px;line-height:1.6}
/* --- dashboard styling corrections --- */
.trainsel button.on{background:rgba(242,130,12,.14);color:var(--chrome);border:1.5px solid var(--acid)}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:12px}
.legend .lg{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim)}
.legend .lg i{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.legend .lg.go i{background:var(--ok)}.legend .lg.stop i{background:var(--alarm)}.legend .lg.hold i{background:var(--warn)}
.rbar{height:7px;background:#e9edf2;border-radius:5px;overflow:hidden;margin-top:9px}
.rbar i{display:block;height:100%;border-radius:5px}
.rmini{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.rmini button{background:#fff;border:1px solid var(--line-l);color:var(--wink);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.rmini button:hover{border-color:var(--acid);background:#fff7ef}
.rmini input{width:82px;padding:6px 8px;border:1px solid var(--line-l);border-radius:7px;font-family:'IBM Plex Mono',monospace}
.rmi::before{width:5px}
.btn.discard{background:#fdecec;color:var(--alarm);border:1px solid #f6c9c9}
.btn.discard:hover{background:#fbdede;border-color:var(--alarm)}
.whobar{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:flex-end;margin:10px 0 6px;padding:12px 15px;background:linear-gradient(180deg,#fff,#fbfcfe);border:1px solid var(--line-l);border-left:4px solid var(--acid);border-radius:11px}
.whobar .wb i{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--wink-dim);font-style:normal;margin-bottom:3px}
.whobar .wb b{font-size:17px;font-weight:700;color:var(--wink);line-height:1.05}
.whobar .wb.co b{color:var(--acid-deep)}
.whobar .wb.loc b{font-size:13px;color:var(--wink-dim);font-weight:600}
table.rep td,table.rep th{padding:11px 12px}
table.rep tbody tr{border-bottom:1px solid var(--line-l)}
.stockmx{width:100%;border-collapse:collapse;cursor:default}
.stockmx:hover{color:inherit}
.stockmx th,.stockmx td{padding:8px 10px;vertical-align:middle}
.stockmx thead th{border-bottom:1.5px solid var(--line-l)}
.stockmx thead tr:nth-child(1) th.grp{text-align:center;text-transform:none;letter-spacing:0;font-size:12px;font-weight:700;color:var(--wink);border-bottom:1px solid #eef1f4}
.stockmx thead tr:nth-child(2) th{font-size:10px;color:var(--wink-dim);font-weight:600;text-transform:none;letter-spacing:.2px;text-align:center}
.stockmx td.locname{font-weight:700;color:var(--wink);white-space:nowrap;font-size:13px}
.stockmx .gsep{border-left:1px solid var(--line-l)}
.stockmx tbody td{border-bottom:1px solid var(--line-l)}
.stockmx tbody tr:last-child td{border-bottom:none}
.stockmx input{width:88px;padding:6px;border:1px solid var(--line-l);border-radius:6px;text-align:right;background:#fafbfc;font-size:12.5px}
.stockmx input:disabled{background:#f3f5f8;color:#aeb6c2}
.stockmx td.lowcell input{border-color:#e8a48f;background:#fdf3ef;color:#b4482a;font-weight:700}
.stockmx .lowtag,.stockmx .oktag{display:inline-block;margin-left:7px;font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:9px;vertical-align:middle}
.stockmx .lowtag{background:rgba(232,130,90,.15);color:#c05a2e}
.stockmx .oktag{background:rgba(34,171,87,.12);color:#1f8f4b}
.stockmx .uwrap{position:relative;display:inline-block}
.stockmx .uwrap input{padding-right:26px}
.stockmx .uwrap .u{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#9aa4b2;pointer-events:none}
.stockmx tfoot td{border-top:1.5px solid var(--line-l);font-weight:700;color:var(--wink);font-size:12.5px;padding-top:10px}
.stockmx tfoot .tv{font-family:'IBM Plex Mono',monospace}
.stockmx tfoot .tlbl{color:var(--wink-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
</style>

<body>

<div id="login">
  <div class="lcard">
    <img src="pmpl-logo.jpg" alt="Polyfill Microns" style="border-radius:50%">
    <div class="lbrand">Polyfill Microns Pvt. Ltd.</div>
    <h1>CARS Operator Portal</h1>
    <div class="sub">Chromic Acid Recycling · sign in to continue</div>
    <label>Username</label><input id="liEmail" type="text" autocomplete="username" placeholder="username (admins: your email)">
    <label>Password</label><input id="liPass" type="password" autocomplete="current-password">
    <button class="lbtn" id="liBtn">Sign in</button>
    <div class="lerr" id="liErr"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="ctx"><div class="c1" id="hCtx1">CARS</div><div class="c2" id="hCtx2"></div></div>
    <div class="who"><b id="hName">—</b><span id="hRole"></span></div>
    <div class="sp"></div>
    <div class="brandR"><img src="pmpl-logo.jpg" alt="Polyfill Microns" style="border-radius:50%"><div class="bt"><b>Polyfill Microns Pvt Ltd</b><span>Recycling &amp; pollution control</span></div></div>
    <button class="ghost" id="hOut">Sign out</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer><strong>Polyfill Microns Pvt Ltd</strong> · CARS · RWRS · CARWARS operator application.<br><span id="copy"></span></footer>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const CFG = window.CARS_CONFIG;
const sb = createClient(CFG.url, CFG.anonKey, { auth:{ persistSession:true, autoRefreshToken:true, storage: window.sessionStorage } });

const $=s=>document.querySelector(s);

function rho(tb,c){if(!c)return 1;const t=(tb||[]).slice().sort((a,b)=>a[0]-b[0]);if(!t.length)return 1;
 if(c<=t[0][0])return t[0][1];if(c>=t[t.length-1][0])return t[t.length-1][1];
 for(let i=0;i<t.length-1;i++){if(c>=t[i][0]&&c<=t[i+1][0]){const[x0,y0]=t[i],[x1,y1]=t[i+1];return y0+(y1-y0)*(c-x0)/(x1-x0);}}return 1;}
const h2so4_50=(c,v)=>(c>0&&v>0)?v*rho(SETTINGS.h2so4_density,c)*(c/100)/((SETTINGS.acidStockPct||50)/100):0;
const naoh_100=(c,v)=>(c>0&&v>0)?v*rho(SETTINGS.naoh_density,c)*(c/100):0;

async function doLogin(){
  const raw=$('#liEmail').value.trim(),password=$('#liPass').value;
  const email=raw.includes('@')?raw:(raw.toLowerCase()+'@pmpl.local');
  $('#liErr').textContent='';$('#liBtn').disabled=true;$('#liBtn').textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email,password});
  $('#liBtn').disabled=false;$('#liBtn').textContent='Sign in';
  if(error)$('#liErr').textContent=(raw.includes('@')?'':'Check your username and password. ')+(error.message||'Sign-in failed');
}
$('#hOut').onclick=async()=>{
  if(CUR&&CUR.id&&CUR.status==='draft'){const g=await confirmComplete();if(g==='cancel')return;if(g==='complete'){await saveCurrent(true);}else{await saveCurrent(false);}}
  await sb.auth.signOut();
};
sb.auth.onAuthStateChange(async(_e,session)=>{
  if(session&&session.user){ if(ME&&ME.id===session.user.id) return; await boot(session.user); }
  else{$('#app').classList.add('hide');$('#login').classList.remove('hide');ME=null;CUR=null;}
});
async function boot(user){
  const {data:prof,error}=await sb.from('profiles').select('id,full_name,username,role,active,client_id,location_id,clients(name),locations(name)').eq('id',user.id).single();
  if(error||!prof){$('#liErr').textContent='Profile not found. Contact admin.';await sb.auth.signOut();return;}
  if(!prof.active){$('#liErr').textContent='Your account is deactivated. Contact admin.';await sb.auth.signOut();return;}
  ME={id:prof.id,role:prof.role,name:prof.full_name||prof.username||user.email,email:user.email,client_id:prof.client_id,location_id:prof.location_id,
      clientName:prof.clients?.name||'',locationName:prof.locations?.name||''};
  {const {data:gs}=await sb.from('settings').select('data').is('client_id',null).maybeSingle();
   let cs=null; if(ME.client_id){const r=await sb.from('settings').select('data').eq('client_id',ME.client_id).maybeSingle();cs=r.data;}
   SETTINGS=Object.assign({},DEFAULTS,gs?.data||{},cs?.data||{});}
  if(ME.client_id){const {data:inv}=await sb.from('inventory').select('*').eq('client_id',ME.client_id).eq('location_id',ME.location_id);INV=inv||[];
    if(ME.location_id){const {data:st}=await sb.from('location_state').select('data').eq('location_id',ME.location_id).maybeSingle();LS=st?.data||{};}}
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#hCtx1').textContent=ME.role==='admin'?'Administrator':(ME.clientName||'CARS');
  $('#hCtx2').textContent=ME.role==='admin'?'Console':(ME.locationName||'');
  $('#hName').textContent=ME.name;$('#hRole').textContent=ME.role;
  $('#copy').textContent='© '+new Date().getFullYear()+' Polyfill Microns Pvt Ltd — sole and exclusive property. Unauthorised copying, modification or distribution prohibited.';
  buildTabs();
}
function buildTabs(){
  const tabs=ME.role==='admin'
    ?[['reports','Reports'],['techs','Technicians'],['company','Companies & stock'],['settings','Settings']]
    :[['cycle','Current cycle'],['mine','My cycles']];
  const nav=$('#tabs');nav.innerHTML='';
  const last=sessionStorage.getItem('cars_tab');let si=tabs.findIndex(t=>t[0]===last);if(si<0)si=0;
  tabs.forEach(([k,l])=>{const b=el('button',null,l);b.onclick=()=>go(k,b);nav.appendChild(b);});
  go(tabs[si][0],nav.children[si]);
}
function go(tab,btn){document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');
  try{sessionStorage.setItem('cars_tab',tab);}catch(e){}
  const m=$('#main');m.innerHTML='';
  ({cycle:screenCycle,mine:screenMine,reports:screenReports,techs:screenTechs,company:screenCompany,settings:screenSettings})[tab](m);}

function cd(){return CUR.data;}
function impurity(){var v=num(cd().spentFe)+num(cd().spentCr3);return v||(SETTINGS.feedFe+SETTINGS.feedCr3);}
function feedTarget(){var i=impurity();return i>0?SETTINGS.workingCapKg*1000/i:0;}
function stepTarget(i){var s=STEPS[i];switch(s.ep){case'feed':return feedTarget();case'dilute':return SETTINGS.diluteCutL;case'ct2':return SETTINGS.ct2TargetL;case'void':return SETTINGS.voidL;case'regen':return SETTINGS.regenBV*SETTINGS.bedL;default:return SETTINGS.bedL;}}

function ddField(label,key,unit,cross){var w=el('div','fieldd');w.appendChild(el('label',null,label));
  var i=document.createElement('input');i.className='mono';i.value=cd()[key]||'';i.addEventListener('input',function(){cd()[key]=i.value;if(cross)cross(i.value);syncImp();paint();totals();});
  w.appendChild(i);if(unit)w.appendChild(el('span','u',unit));REF['lv_'+key]=i;return w;}
function impCol(title,keys,totId,hint){var c=el('div','impc');c.innerHTML='<span class="it">'+title+'</span>';
  var r=el('div','improw'),labels=['Fe','Cr³⁺'];
  keys.forEach(function(k,idx){if(idx)r.appendChild(document.createTextNode(' + '));r.appendChild(document.createTextNode(labels[idx]+' '));
    var i=document.createElement('input');i.className='simp';i.value=cd()[k]||'';i.addEventListener('input',function(){cd()[k]=i.value;liveCross(k,i.value);syncImp();paint();totals();});r.appendChild(i);});
  r.appendChild(document.createTextNode(' = '));var t=el('span','imptot');t.id=totId;r.appendChild(t);
  c.appendChild(r);c.appendChild(el('div',null,'<small style="color:var(--ink-faint);font-size:10px">'+hint+'</small>'));return c;}
function liveCross(k,v){var d=cd();
  if(k==='spentFe'){d.feedFe=v;if(REF.feedFe)REF.feedFe.value=v;}
  else if(k==='spentCr3'){d.feedCr3=v;if(REF.feedCr3)REF.feedCr3.value=v;}
  else if(k==='treatFe'){d.treatFeL=v;if(REF.treatFeL)REF.treatFeL.value=v;}
  else if(k==='treatCr3'){d.treatCr3L=v;if(REF.treatCr3L)REF.treatCr3L.value=v;}}
function logField(label,key,opt){opt=opt||{};var w=el('div','f');var lb=el('label',null,label+(opt.auto?' <span style="color:var(--acid-deep);font-weight:700;font-size:9px;letter-spacing:.3px;margin-left:5px;text-transform:uppercase">auto</span>':''));w.appendChild(lb);
  var i=document.createElement('input');i.className='mono';if(opt.auto)i.style.cssText='background:#fff5ec;border-color:#f3c79b;color:var(--acid-deep);font-weight:600';if(opt.ro){i.readOnly=true;}i.value=(cd()[key]!=null?cd()[key]:'');
  if(!opt.ro)i.addEventListener('input',function(){cd()[key]=i.value;totals();});REF[key]=i;w.appendChild(i);return w;}

function add2(p,cls,html){p.appendChild(el('div',cls,html));}
function syncImp(){var si=num(cd().spentFe)+num(cd().spentCr3),ti=num(cd().treatFe)+num(cd().treatCr3);
  if($('#spentImp'))$('#spentImp').textContent=(si?fmt(si,1):'—')+' g/L';if($('#treatImp'))$('#treatImp').textContent=(ti?fmt(ti,1):'—')+' g/L';}
function renderTanks(){var tk=$('#cyTanks');if(!tk)return;tk.innerHTML='';var d=cd();
  TANKS.forEach(function(a){var k=a[0],desc=a[1],col=a[2],cap=SETTINGS.tankCaps[k]||1000,lvl=num(d.tanks[k]),pct=cap>0?Math.min(100,lvl/cap*100):0;
    var flag=pct>=95?'<span class="tflag hi">HIGH</span>':(pct<=5&&lvl>0?'<span class="tflag lo">LOW</span>':'');
    var e=el('div','tank',flag+'<div class="tk">'+(k==='H2'?'H₂SO₄':(k==='SP'?'Spent H₂SO₄':k))+'</div><div class="td">'+desc+'</div><div class="tvis"><i style="height:'+pct+'%;background:'+col+'"></i></div><div class="tval"><b>'+fmt(lvl,0)+'</b> / '+fmt(cap,0)+' L</div>');
    e.onclick=function(){tankModal(k,desc,cap,lvl);};tk.appendChild(e);});}
function tankModal(k,desc,cap,lvl){
  var name=(k==='H2'?'H₂SO₄':(k==='SP'?'Spent H₂SO₄':k));
  var md=el('div','modal');
  md.innerHTML='<div class="mc"><h3>'+name+' — set level</h3><p>'+esc(desc)+' · capacity '+fmt(cap,0)+' L</p>'+
    '<label style="font-size:12px;color:var(--wink-dim)">Level (L)</label><input id="tkIn" type="number" min="0" max="'+cap+'" value="'+lvl+'">'+
    '<div class="err" id="tkErr"></div>'+
    '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn g" id="tkC">Cancel</button><button class="btn primary" id="tkS">Save</button></div></div>';
  document.body.appendChild(md);
  var inp=md.querySelector('#tkIn');inp.focus();inp.select();
  md.querySelector('#tkC').onclick=function(){md.remove();};
  md.querySelector('#tkS').onclick=function(){var v=num(inp.value);if(inp.value===''||isNaN(parseFloat(inp.value))){md.querySelector('#tkErr').textContent='Enter a number.';return;}
    if(v<0){md.querySelector('#tkErr').textContent='Level cannot be negative.';return;}
    if(v>cap){md.querySelector('#tkErr').textContent='Level cannot exceed capacity ('+fmt(cap,0)+' L).';return;}
    cd().tanks[k]=v;md.remove();renderTanks();};
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')md.querySelector('#tkS').click();if(ev.key==='Escape')md.remove();});
}
function paint(){var d=cd(),i=d.step,s=STEPS[i],tv=stepTarget(i),rail=$('#cyRail');if(!rail)return;
  Array.prototype.forEach.call(rail.children,function(e,k){e.className='step'+(k<i?' done':'')+(k===i?' active':'');});
  if($('#cyHint'))$('#cyHint').textContent='Step '+(i+1)+' of '+STEPS.length+' · '+s.route;
  if($('#tFlow'))$('#tFlow').textContent=fmt(i===5?SETTINGS.regenFlowLPH:SETTINGS.feedFlowLPH,0);
  if($('#tVol'))$('#tVol').textContent=tv?fmt(tv,0):'—';
  var vol=num(d.vol),pct=tv>0?Math.min(100,vol/tv*100):0;
  if($('#progTxt'))$('#progTxt').textContent=fmt(vol,0)+' / '+fmt(tv,0)+' L';if($('#progBar'))$('#progBar').style.width=pct+'%';
  if($('#progName'))$('#progName').textContent=s.ep==='manual'?'Manual step':(s.ep==='cond'?'Rinsing — watch conductivity':'Progress');
  cue();}
function cue(){var d=cd(),i=d.step,s=STEPS[i],c=$('#cue');if(!c)return;var cond=num(d.cond),vol=num(d.vol),tv=stepTarget(i);c.className='cue';var cls='go',t=s.route,x='';

function metrics(d){var imp=(num(d.feedFe)+num(d.feedCr3))||(SETTINGS.feedFe+SETTINGS.feedCr3);var fv=num(d.feedVol)||(imp>0?SETTINGS.workingCapKg*1000/imp:0);

async function remAct(a){

   "E('body').innerHTML=tab==='board'?boardHTML(r):(tab==='log'?logHTML(r):totHTML(r));"+
   "if(!single){E('prev').disabled=idx===0;E('next').disabled=idx===ROWS.length-1;}}"+
   "window.setTab=function(t){tab=t;render();};"+
   "E('prev').onclick=function(){if(idx>0){idx--;render();}};E('next').onclick=function(){if(idx<ROWS.length-1){idx++;render();}};E('prn').onclick=function(){window.print();};"+
   "var ICG=\"<svg viewBox='0 0 24 24' width='12' height='12' style='vertical-align:middle'><circle cx='12' cy='12' r='9.2' fill='none' stroke='#1B3A6B' stroke-width='1.5'/><ellipse cx='12' cy='12' rx='4' ry='9.2' fill='none' stroke='#1B3A6B' stroke-width='1.1'/><path d='M3 12h18' stroke='#1B3A6B' stroke-width='1.1'/></svg>\";"+
   "var ICM=\"<svg viewBox='0 0 24 24' width='12' height='12' style='vertical-align:middle'><rect x='2.5' y='5' width='19' height='14' rx='2.2' fill='none' stroke='#1B3A6B' stroke-width='1.5'/><path d='M3.5 6.5l8.5 6 8.5-6' fill='none' stroke='#1B3A6B' stroke-width='1.3'/></svg>\";"+
   "var ICC=\"<svg viewBox='0 0 24 24' width='26' height='26'><rect x='3' y='4.5' width='18' height='16.5' rx='2.2' fill='none' stroke='#1B3A6B' stroke-width='1.5'/><path d='M3 9.5h18M8 2.5v4M16 2.5v4' stroke='#1B3A6B' stroke-width='1.5' fill='none'/><circle cx='16.6' cy='15.4' r='3.7' fill='#fff' stroke='#1B3A6B' stroke-width='1.2'/><path d='M16.6 13.6v1.9l1.3.9' stroke='#1B3A6B' stroke-width='1' fill='none'/></svg>\";"+
   "function dd(x){if(!x)return '\u2014';var d=new Date(x);return isNaN(d.getTime())?String(x):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}"+
   "function cap(s){s=String(s||'');return s?s.charAt(0).toUpperCase()+s.slice(1):'\u2014';}"+
   "function fr(k,v){return \"<div class='prow2'><span class='k'>\"+k+\"</span><span class='cln'>:</span><span class='v'>\"+v+\"</span></div>\";}"+
   "function sc(t,b){return \"<div class='card2'><div class='sh'>\"+t+\"</div>\"+b+\"</div>\";}"+
   "function plh(){return \"<div class='plh'><img class='lg' width='54' height='54' src='\"+(META.logo||'')+\"'><div class='co'><div class='nm'>POLYFILL MICRONS PVT. LTD.</div><div class='tg'>Air &amp; Water Pollution Control Systems \u00b7 Chromic Acid Recycling (CARS)</div></div><div class='ct'><div class='r'>\"+ICG+\"<span>www.polyfillmicrons.in</span></div><div class='r'>\"+ICM+\"<span>info@polyfillmicrons.in</span></div></div></div><div class='plhrule'></div>\";}"+
   "function metaCard(r){return \"<div class='card2 metac'><div class='metagrid'><div>\"+fr('Cycle Date',dd(r.cycle_date))+fr('Completed On',dt(r.completed_at))+fr('Train',esc((r.data&&r.data.train)||r.train||'\u2014'))+fr('Technician',esc(te(r))||'\u2014')+\"</div><div>\"+fr('Company',esc(co(r))||'\u2014')+fr('Location',esc(lo(r))||'\u2014')+fr('Cycle Status',cap(r.status))+\"</div></div></div>\";}"+
   "function notesCard(r){var n=r.data&&r.data.notes?esc(r.data.notes):'';return \"<div class='notesc'><div class='nh'>Notes (if any)</div>\"+(n?\"<div class='nt'>\"+n+\"</div>\":'')+\"<div class='nl'></div><div class='nl'></div><div class='nl'></div>\"+(n?'':\"<div class='nl'></div><div class='nl'></div>\")+\"</div>\";}"+
   "function pfoot(r){var done=(r.status==='completed'&&r.completed_at);return \"<div class='pfoot'><div class='sig'><div class='sl'></div><div class='st'>FOR POLYFILL MICRONS PVT. LTD.</div></div>\"+(done?\"<div class='cc'>\"+ICC+\"<div><div class='l'>Cycle Completed On</div><div class='d'>\"+dd(r.completed_at)+\"</div></div></div>\":'')+\"</div><div class='disc'>This is a system generated report and does not require any signature.</div>\";}"+
   "E('printAll').innerHTML=ROWS.map(function(r){return \"<div class='preport'>\"+plh()+"+
   "\"<div class='prh'><span class='ln'></span>CARS CYCLE REPORT<span class='ln'></span></div>\"+"+
   "metaCard(r)+"+
   "\"<div class='secgrid'>\"+"+
   "sc('Readings',fr('Flow LPH',g(r,'flow',0))+fr('Conductivity',g(r,'cond'))+fr('Spent Fe / Cr\u00b3\u207a (g/L)',g(r,'spentFe')+' / '+g(r,'spentCr3'))+fr('Completed',dt(r.completed_at)))+"+
   "sc('Feed',fr('Chromic L',g(r,'feedVol',0))+fr('Feed CrO\u2083',g(r,'feedCrO3'))+fr('Feed Fe / Cr\u00b3\u207a (g/L)',g(r,'feedFe')+' / '+g(r,'feedCr3'))+fr('Feed Cu (g/L)',g(r,'feedCu')))+"+
   "sc('Treated',fr('CT2 L',g(r,'ct2',0))+fr('Treated CrO\u2083 (g/L)',g(r,'treatCrO3'))+fr('Treated Fe / Cr\u00b3\u207a (g/L)',g(r,'treatFeL')+' / '+g(r,'treatCr3L')))+"+
   "sc('Regeneration',fr('CARS H\u2082SO\u2084',g(r,'carsPct')+'% \u2022 '+g(r,'carsVol',0)+' L')+fr('CARWARS anion',g(r,'cwAnPct')+'% \u2022 '+g(r,'cwAnVol',0)+' L')+fr('RWRS cation',g(r,'rwCatPct')+'% \u2022 '+g(r,'rwCatVol',0)+' L'))+"+
   "\"</div>\"+"+
   "\"<div class='sh sh2'>Reminders &amp; Flags (current status)</div><div class='rnwrap'>\"+remCards(r)+notesCard(r)+\"</div>\"+"+
   "pfoot(r)+"+
   "\"</div>\";}).join('');"+
   "render();"+
   "<\/scr"+"ipt></body></html>";
  return doc;
}
function htmlReport(rows,from,to,print){
  if(!rows||!rows.length){toast('No cycles to show');return;}
  var est={h2:h2PerRegen50(),na:naPerCarwars(),carwarsThresh:SETTINGS.carwarsThreshKg,rwrsThresh:SETTINGS.rwrsThreshL,bathCeil:SETTINGS.bathCeilingFe};
  var meta={from:from,to:to,logo:(location.origin||'')+'/pmpl-logo.jpg',est:est};
  var md=el('div','modal');md.style.cssText='padding:0;align-items:stretch;justify-content:stretch;z-index:70';
  var box=el('div');box.style.cssText='background:#eef1f5;width:100%;height:100%;display:flex;flex-direction:column';
  var bar=el('div');bar.style.cssText='display:flex;align-items:center;gap:10px;background:#10141d;color:#fff;padding:10px 16px;flex:none';
  bar.innerHTML='<b style="font-size:14px">CARS cycle report</b><span style="font-size:12px;color:#9fbfae">'+rows.length+' cycle(s)</span>';
  var sp=el('div');sp.style.flex='1';bar.appendChild(sp);
  var bPrint=el('button','btn sm','Print');bPrint.style.cssText='background:#f2820c;color:#1a1206';
  var bClose=el('button','btn sm g','✕ Close');
  bar.append(bPrint,bClose);box.appendChild(bar);
  var ifr=document.createElement('iframe');ifr.style.cssText='flex:1;border:0;width:100%;background:#eef1f5';ifr.setAttribute('title','CARS report');ifr.srcdoc=reportDoc(rows,meta);box.appendChild(ifr);
  md.appendChild(box);document.body.appendChild(md);
  function close(){md.remove();document.removeEventListener('keydown',onKey);}
  function onKey(e){if(e.key==='Escape')close();}
  document.addEventListener('keydown',onKey);
  bClose.onclick=close;
  bPrint.onclick=function(){try{ifr.contentWindow.focus();ifr.contentWindow.print();}catch(e){window.print();}};
  if(print)ifr.addEventListener('load',function(){setTimeout(function(){try{ifr.contentWindow.focus();ifr.contentWindow.print();}catch(e){}},350);});
}
function excelExport(rows,from,to){
  const detail=rows.map(r=>{const d=r.data||{};const base={Date:r.cycle_date,Technician:rTech(r),Company:rCo(r),Location:rLoc(r),Train:r.train,Status:r.status,
    'Chromic L':+r.chromic_processed_l||0,'CrO3 recovered kg':+r.cro3_recovered_kg||0,'Fe removed kg':+r.fe_removed_kg||0,'Recovery %':+r.recovery_pct||0,'H2SO4 50% kg':+r.h2so4_50_kg||0,'NaOH 100% kg':+r.naoh_100_kg||0};
    ['flow','cond','spentFe','spentCr3','feedCrO3','feedFe','feedCr3','feedCu','ct2','treatCrO3','treatFeL','treatCr3L','treatCu','carsPct','carsVol','recyc','cw1Pct','cw1Vol','cwAnPct','cwAnVol','cw2Pct','cw2Vol','rwCatPct','rwCatVol','rwAnPct','rwAnVol'].forEach(k=>base[labelOf(k)]=d[k]!==''&&d[k]!=null?+d[k]:'');base.Notes=d.notes||'';return base;});
  const sum=f=>rows.reduce((a,x)=>a+(+f(x)||0),0);
  const summary=[['Cycles',rows.length],['Completed',rows.filter(x=>x.status==='completed').length]].map(([Metric,Value])=>({Metric,Value}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Summary');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detail),'Cycles');XLSX.writeFile(wb,'CARS_'+(from||'all')+'_'+(to||'')+'.xlsx');
}
function jsonExport(rows,from,to){const blob=new Blob([JSON.stringify({owner:'Polyfill Microns Pvt Ltd',from,to,exported:new Date().toISOString(),cycles:rows},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CARS_'+(from||'all')+'.json';a.click();URL.revokeObjectURL(a.href);}

/* ---- tiny helpers ---- */
function lw(label,control){const w=el('div','f');w.appendChild(el('label',null,label));w.appendChild(control);return w;}
function add(p,cls,html){p.appendChild(el('div',cls,html));}
function inp(type){const i=document.createElement('input');i.type=type;return i;}
function opt(v,t){const o=document.createElement('option');o.value=v;o.textContent=t;return o;}
